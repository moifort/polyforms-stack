name: Publish

# A `vX.Y.Z` tag publishes the package through npm trusted publishing (OIDC): no
# token to store or rotate. The tag must match package.json and CHANGELOG.md must
# have the version's entry, which the upgrade routine reads first.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release
  id-token: write   # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run preflight
      - name: The tag, the package and the changelog agree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(bun -e 'console.log(require("./package.json").version)')" = "$version"
          grep -q "^## ${version} " CHANGELOG.md
      # A tag pushed again (to carry its notes) must not fail on a version npm already has.
      - name: Publish, unless this version is already on npm
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "@moifort/stack@${version}" version >/dev/null 2>&1; then
            echo "::notice::@moifort/stack ${version} is already published"
          else
            npm publish --provenance --access public
          fi
      # The GitHub release carries the version's changelog section, as the tag does.
      - name: GitHub release with the version's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md
          fi
